<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Git Untrack plugin icon</title>
  <desc id="desc">Orange Git branch disconnected from a white document by a red minus symbol on a dark rounded square background.</desc>
  <defs>
    <radialGradient id="bg" cx="44%" cy="32%" r="85%">
      <stop stop-color="#252e3e"/>
      <stop offset="0.66" stop-color="#121823"/>
      <stop offset="1" stop-color="#0a0d15"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6e0ee"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eff5ff"/>
      <stop offset="1" stop-color="#bacbe0"/>
    </linearGradient>
    <linearGradient id="git" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff853d"/>
      <stop offset="1" stop-color="#ff4038"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff4145"/>
      <stop offset="1" stop-color="#dc101c"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="12" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#0c1018"/>
  <rect x="42" y="42" width="940" height="940" rx="215" fill="url(#bg)"/>
  <!-- Git branch -->
  <g fill="none" stroke="url(#git)" stroke-width="57" stroke-linecap="round" stroke-linejoin="round">
    <path d="M228 300V496"/>
    <path d="M228 496L374 590L374 660"/>
    <path d="M228 300L318 373"/>
  </g>
  <g fill="#401a21" stroke="url(#git)" stroke-width="34">
    <circle cx="228" cy="300" r="47"/>
    <circle cx="228" cy="496" r="47"/>
    <circle cx="374" cy="660" r="47"/>
  </g>
  <!-- Broken link -->
  <path d="M365 403L391 427M417 449L429 458" fill="none" stroke="#c3d0e4" stroke-width="29" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- File that remains on disk -->
  <g filter="url(#shadow)">
    <path d="M597 253H762L897 389V676Q897 701 873 701H584Q559 701 559 676V290Q559 253 597 253Z" fill="url(#paper)"/>
    <path d="M762 253V348Q762 389 803 389H897Z" fill="url(#fold)"/>
    <g stroke="#9eafc6" stroke-width="30" stroke-linecap="round">
      <path d="M680 457H817"/>
      <path d="M680 529H817"/>
      <path d="M680 601H817"/>
    </g>
  </g>
  <!-- Remove from index (not delete from disk) -->
  <g filter="url(#shadow)">
    <circle cx="535" cy="482" r="88" fill="#101721"/>
    <circle cx="523" cy="472" r="79" fill="url(#red)" stroke="#ffffff" stroke-width="11"/>
    <path d="M496 472H550" stroke="#ffffff" stroke-width="25" stroke-linecap="round"/>
  </g>
</svg>
